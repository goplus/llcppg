{
	"FuncPrefix": ["Py"],
	"TypePrefix": ["Py"],
	"TypeAbbr": [
		"*Object: $1"
	],
    "TypeDef": {
        "": [{
            "Name": "ModuleObject",
            "Fields": [".Object", "*byte", "int", ".SizeT"]
        }]
    },
	"NewCheck": [
		"Py*_FromObject: $1Object .As$1",
		"Py*_From*: $1Object $1From$2",
		"PyModule_GetDict: DictObject (*ModuleObject).Dict",
		"Py*_NewObject: $1Object $1NewObject",
		"Py*_New: $1Object $1New"
	],
	"MethodCheck": [
		"Py_: ",
		"PyThread_tss_: TssT",
		"Py*_: $1Object, $1"
	],
	"ForceCamelCase": true
}
