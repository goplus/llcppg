{
	"LLGoPackage": "link: -L/path/foo -lfoo",
	"CFlags": "-I/path/foo/include",
	"WrapFileHeader": "#include <foo.h>\n",
	"TypePrefix": ["z_"],
	"FuncPrefix": ["z_"],
	"MacroFunc": {
		"z_gzgetc": "gzgetc_",
		"z_deflateInit": "deflateInit_",
		"z_reset": "reset_",
		"z_flush": "flush_"
	},
	"KeepDoc": true
}
