{
	"name": "lua",
	"cflags": "$(pkg-config --cflags lua)",
	"libs": "$(pkg-config --libs lua)",
	"include": [
		"lua.h",
		"luaconf.h",
		"lualib.h",
		"lauxlib.h"
	],
	"trimPrefixes": ["lua_", "luaopen_", "luaL_", "LUA_T", "LUA_"],
	"symMap": {
		"luaL_alloc": "LuaLAlloc"
	},
	"cplusplus": false
}
