# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: LLGo

on:
  push:
    branches:
      - "main"
      - "dev"
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        llvm: [22]
        llgo: [main]
        go: [1.27]
        installer: [action, standalone]
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@v7
    - name: Setup llgo
      if: matrix.installer == 'action'
      uses: cpunion/setup-llgo@6676861b76e6095866319e6c267d3809baa3cbfe
      with:
        llvm-version: ${{ matrix.llvm }}
        llgo-version: ${{ matrix.llgo }}
        go-version: ${{ matrix.go }}

    - name: Checkout the same standalone installer
      if: matrix.installer == 'standalone'
      uses: actions/checkout@v7
      with:
        repository: cpunion/setup-llgo
        ref: 6676861b76e6095866319e6c267d3809baa3cbfe
        path: .setup-llgo
        persist-credentials: false
    - name: Provide the standalone installer's Go launcher
      if: matrix.installer == 'standalone'
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
        cache: false
    - name: Setup llgo without the action
      if: matrix.installer == 'standalone'
      shell: bash
      env:
        LLVM_VERSION: ${{ matrix.llvm }}
        LLGO_VERSION: ${{ matrix.llgo }}
        GO_VERSION: ${{ matrix.go }}.0
        GH_TOKEN: ${{ github.token }}
      run: bash .setup-llgo/scripts/install.sh

    - name: Check the active toolchain and HTTPS after installation
      shell: bash
      run: |
        GOTOOLCHAIN=local go version
        llvm-config --version
        llgo version
        git ls-remote https://github.com/xgo-dev/llgo HEAD
        curl --fail --silent --show-error --head https://github.com

    - name: Test with coverage
      shell: bash
      run: |
        llgo test -v -coverpkg=./... -covermode=atomic -coverprofile=coverage.txt ./...
        go tool cover -func=coverage.txt | tail -1
